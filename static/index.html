<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dictation</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f3f0e8;
      --card: #fffcf7;
      --ink: #1d1c19;
      --muted: #5e5a53;
      --line: #ddd6c8;
      --accent: #1f4b3a;
      --accent-ink: #f7f4ee;
      --danger: #8d2e2e;
      --danger-bg: #f8e8e4;
      --warn: #efe6d6;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font: 16px/1.5 "Segoe UI", sans-serif;
    }

    main {
      width: min(40rem, calc(100% - 2rem));
      margin: 3rem auto;
    }

    h1 {
      margin: 0 0 0.25rem;
      font-size: 1.75rem;
      font-weight: 650;
      letter-spacing: -0.02em;
    }

    .lede {
      margin: 0 0 1.25rem;
      color: var(--muted);
    }

    .status {
      min-height: 1.5rem;
      margin: 0 0 1rem;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 1.25rem;
    }

    .drop {
      border: 1px dashed var(--line);
      border-radius: 10px;
      padding: 1.25rem;
      text-align: center;
    }

    .drop.hot { border-color: var(--accent); background: #f3f7f4; }

    .file-meta {
      margin: 0.85rem 0 0;
      font-weight: 600;
    }

    .hint {
      margin: 0.35rem 0 0;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .actions, .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 1rem;
    }

    .toolbar { margin: 0 0 1rem; }

    button {
      appearance: none;
      border: 1px solid transparent;
      border-radius: 8px;
      padding: 0.55rem 0.9rem;
      font: inherit;
      cursor: pointer;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }

    .primary {
      background: var(--accent);
      color: var(--accent-ink);
    }

    .stop {
      background: #c13a3a;
      color: #fff;
    }

    .secondary {
      background: transparent;
      border-color: var(--line);
      color: var(--ink);
    }

    .secondary.on {
      border-color: var(--accent);
      background: #f3f7f4;
    }

    .error {
      margin: 1rem 0 0;
      padding: 0.75rem 0.9rem;
      border-radius: 8px;
      background: var(--danger-bg);
      color: var(--danger);
    }

    .progress-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.4rem;
      margin: 0 0 0.35rem;
      font-weight: 650;
    }

    .progress-row input {
      width: 4.2rem;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 0.25rem 0.4rem;
      font: inherit;
      font-weight: 650;
      text-align: center;
    }

    .stamp {
      margin: 0 0 0.75rem;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .seek {
      display: grid;
      grid-template-columns: 4.2rem 1fr 4.2rem;
      gap: 0.6rem;
      align-items: center;
      margin: 0 0 1rem;
    }

    .seek input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
    }

    .seek span {
      color: var(--muted);
      font-size: 0.85rem;
      font-variant-numeric: tabular-nums;
    }

    .shortcuts {
      margin: 0.15rem 0 1rem;
      color: var(--muted);
      font-size: 0.8rem;
    }

    textarea {
      width: 100%;
      min-height: 7.5rem;
      resize: vertical;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0.8rem;
      font: inherit;
      color: var(--ink);
      background: #fff;
    }

    .review {
      margin-top: 1rem;
      padding-top: 1rem;
      border-top: 1px solid var(--line);
    }

    .grade {
      margin: 0 0 0.75rem;
      font-weight: 650;
    }

    .grade.exact { color: var(--accent); }
    .grade.almost { color: #6a5420; }
    .grade.missed { color: var(--danger); }

    .label {
      margin: 0 0 0.3rem;
      color: var(--muted);
      font-size: 0.85rem;
    }

    .words {
      display: flex;
      flex-wrap: wrap;
      gap: 0.2rem 0.35rem;
      margin: 0 0 0.85rem;
    }

    .words span {
      padding: 0.05rem 0.2rem;
      border-radius: 4px;
    }

    .words .missed { background: var(--danger-bg); }
    .words .extra {
      background: var(--warn);
      color: var(--muted);
      text-decoration: line-through;
    }

    .summary-line {
      margin: 0 0 0.4rem;
      font-size: 1.05rem;
    }

    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <h1>Dictation</h1>
    <p class="lede">Hear a sentence, type it, see what you missed.</p>
    <p id="status" class="status" role="status">Checking the transcription model…</p>

    <section id="prepare" class="card">
      <div id="drop" class="drop">
        <button id="choose" class="secondary" type="button">Choose file</button>
        <input id="file" type="file" accept=".mp3,.wav,.m4a,.webm,.ogg,.flac,audio/*" hidden>
        <p id="file-meta" class="file-meta" hidden></p>
        <p class="hint">mp3, wav, m4a, webm, ogg, or flac. Up to 25 MB. The answer is hidden until you check.</p>
      </div>
      <div class="actions">
        <button id="prepare-btn" class="primary" type="button" disabled>Prepare</button>
        <button id="start-btn" class="primary" type="button" hidden>Start dictation</button>
      </div>
      <p id="error" class="error" hidden></p>
    </section>

    <section id="practice" class="card" hidden>
      <div class="progress-row">
        <label for="jump">Sentence</label>
        <input id="jump" type="number" min="1" step="1" inputmode="numeric">
        <span id="jump-total"></span>
        <button id="jump-go" class="secondary" type="button">Go</button>
      </div>
      <p id="stamp" class="stamp"></p>
      <audio id="player"></audio>
      <div class="seek">
        <span id="seek-now">0:00.0</span>
        <input id="seek" type="range" min="0" max="0" value="0" step="0.05" aria-label="Playback position">
        <span id="seek-end">0:00.0</span>
      </div>
      <div class="toolbar">
        <button id="play" class="primary" type="button">Play</button>
        <button id="speed-75" class="secondary" type="button" data-speed="0.75">0.75x</button>
        <button id="speed-100" class="secondary on" type="button" data-speed="1">1x</button>
        <button id="speed-125" class="secondary" type="button" data-speed="1.25">1.25x</button>
      </div>
      <p class="shortcuts">Ctrl+Space play/stop · [ / ] skip 3s · Ctrl+Up / Down speed · Ctrl+Enter check or next</p>
      <label class="label" for="answer">Type what you heard</label>
      <textarea id="answer" spellcheck="false"></textarea>
      <div class="actions">
        <button id="check" class="primary" type="button">Check</button>
        <button id="reveal" class="secondary" type="button">Reveal</button>
        <button id="skip" class="secondary" type="button">Skip</button>
      </div>
      <div id="review" class="review" hidden>
        <p id="grade" class="grade"></p>
        <p class="label">Answer</p>
        <div id="expected-words" class="words"></div>
        <p class="label">You</p>
        <div id="typed-words" class="words"></div>
        <div class="actions">
          <button id="next" class="primary" type="button">Next</button>
        </div>
      </div>
    </section>

    <section id="summary" class="card" hidden>
      <p id="summary-score" class="summary-line"></p>
      <p id="summary-detail" class="hint"></p>
      <div class="actions">
        <button id="retry" class="primary" type="button">Retry missed</button>
        <button id="new-file" class="secondary" type="button">New file</button>
      </div>
    </section>
  </main>

  <script>
    const ALLOWED = new Set(["mp3", "wav", "m4a", "webm", "ogg", "flac"]);
    const MAX_BYTES = 25 * 1024 * 1024;
    const SPEEDS = [0.75, 1, 1.25];
    const SKIP_SECONDS = 3;

    const statusEl = document.getElementById("status");
    const prepareEl = document.getElementById("prepare");
    const practiceEl = document.getElementById("practice");
    const summaryEl = document.getElementById("summary");
    const dropEl = document.getElementById("drop");
    const chooseEl = document.getElementById("choose");
    const fileEl = document.getElementById("file");
    const fileMetaEl = document.getElementById("file-meta");
    const prepareBtn = document.getElementById("prepare-btn");
    const startBtn = document.getElementById("start-btn");
    const errorEl = document.getElementById("error");
    const jumpEl = document.getElementById("jump");
    const jumpTotalEl = document.getElementById("jump-total");
    const jumpGoEl = document.getElementById("jump-go");
    const stampEl = document.getElementById("stamp");
    const player = document.getElementById("player");
    const seekEl = document.getElementById("seek");
    const seekNowEl = document.getElementById("seek-now");
    const seekEndEl = document.getElementById("seek-end");
    const playEl = document.getElementById("play");
    const answerEl = document.getElementById("answer");
    const checkEl = document.getElementById("check");
    const revealEl = document.getElementById("reveal");
    const skipEl = document.getElementById("skip");
    const reviewEl = document.getElementById("review");
    const gradeEl = document.getElementById("grade");
    const expectedWordsEl = document.getElementById("expected-words");
    const typedWordsEl = document.getElementById("typed-words");
    const nextEl = document.getElementById("next");
    const summaryScoreEl = document.getElementById("summary-score");
    const summaryDetailEl = document.getElementById("summary-detail");
    const retryEl = document.getElementById("retry");
    const newFileEl = document.getElementById("new-file");
    const speedButtons = [document.getElementById("speed-75"), document.getElementById("speed-100"), document.getElementById("speed-125")];

    let selected = null;
    let health = null;
    let busy = false;
    let chunks = [];
    let session = [];
    let results = [];
    let index = 0;
    let scored = false;
    let speed = 1;
    let audioUrl = "";
    let stopAt = 0;
    let preparedMeta = "";
    let draggingSeek = false;

    chooseEl.addEventListener("click", () => fileEl.click());
    fileEl.addEventListener("change", () => {
      const file = fileEl.files && fileEl.files[0];
      if (file) selectFile(file);
    });
    dropEl.addEventListener("dragover", (event) => {
      event.preventDefault();
      dropEl.classList.add("hot");
    });
    dropEl.addEventListener("dragleave", () => dropEl.classList.remove("hot"));
    dropEl.addEventListener("drop", (event) => {
      event.preventDefault();
      dropEl.classList.remove("hot");
      const file = event.dataTransfer.files && event.dataTransfer.files[0];
      if (file) selectFile(file);
    });

    prepareBtn.addEventListener("click", prepareClip);
    startBtn.addEventListener("click", () => startSession(chunks));
    playEl.addEventListener("click", onPlayButton);
    player.addEventListener("play", syncPlayButton);
    player.addEventListener("pause", syncPlayButton);
    player.addEventListener("ended", syncPlayButton);
    jumpGoEl.addEventListener("click", jumpToSentence);
    jumpEl.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.ctrlKey && !event.metaKey) {
        event.preventDefault();
        jumpToSentence();
      }
    });
    seekEl.addEventListener("pointerdown", () => { draggingSeek = true; });
    seekEl.addEventListener("input", () => {
      draggingSeek = true;
      const bounds = sentenceBounds();
      const value = clampToSentence(Number(seekEl.value));
      player.currentTime = value;
      seekNowEl.textContent = formatStamp(value);
      seekEl.value = String(value);
      stopAt = bounds.end;
    });
    seekEl.addEventListener("change", () => {
      draggingSeek = false;
      stopAt = sentenceBounds().end;
    });
    seekEl.addEventListener("pointerup", () => { draggingSeek = false; });
    checkEl.addEventListener("click", checkAnswer);
    revealEl.addEventListener("click", revealAnswer);
    skipEl.addEventListener("click", skipChunk);
    nextEl.addEventListener("click", nextChunk);
    retryEl.addEventListener("click", retryMissed);
    newFileEl.addEventListener("click", resetAll);
    speedButtons.forEach((button) => {
      button.addEventListener("click", () => setSpeed(Number(button.dataset.speed)));
    });
    document.addEventListener("keydown", onShortcut, true);
    player.addEventListener("loadedmetadata", syncSeekBar);
    player.addEventListener("durationchange", syncSeekBar);
    player.addEventListener("timeupdate", onTimeUpdate);

    function selectFile(file) {
      selected = file;
      chunks = [];
      startBtn.hidden = true;
      hideError();
      const problem = validate(file);
      fileMetaEl.hidden = false;
      fileMetaEl.textContent = problem ? file.name : file.name + " — " + formatSize(file.size);
      prepareBtn.disabled = Boolean(problem) || !canPrepare();
      if (problem) showError(problem);
    }

    function validate(file) {
      const extension = file.name.includes(".")
        ? file.name.split(".").pop().toLowerCase()
        : "";
      if (!ALLOWED.has(extension)) {
        return "This file type is not supported. Use mp3, wav, m4a, webm, ogg, or flac.";
      }
      if (file.size === 0) return "The file is empty.";
      if (file.size > MAX_BYTES) return "This file is over 25 MB.";
      return "";
    }

    function canPrepare() {
      return Boolean(health && health.ready) && !busy && selected && !validate(selected);
    }

    async function prepareClip() {
      if (!canPrepare()) return;
      busy = true;
      hideError();
      startBtn.hidden = true;
      prepareBtn.disabled = true;
      statusEl.textContent = "Preparing sentences…";

      const body = new FormData();
      body.append("file", selected, selected.name);

      try {
        const response = await fetch("/api/transcribe", { method: "POST", body });
        if (!response.ok) {
          showError(await readError(response));
          statusEl.textContent = deviceLabel();
          return;
        }
        const payload = await response.json();
        chunks = payload.chunks || [];
        if (!chunks.length) {
          showError("No speech was detected in this file.");
          statusEl.textContent = deviceLabel();
          return;
        }
        preparedMeta = chunks.length + (chunks.length === 1 ? " sentence · " : " sentences · ") + formatDuration(payload.duration_seconds);
        fileMetaEl.textContent = selected.name + " — " + preparedMeta;
        startBtn.hidden = false;
        statusEl.textContent = deviceLabel();
      } catch {
        showError("Preparation failed. The server is not responding.");
        statusEl.textContent = "The server is not responding.";
      } finally {
        busy = false;
        prepareBtn.disabled = !canPrepare();
      }
    }

    function startSession(items) {
      session = items.map((chunk) => ({ ...chunk }));
      results = session.map(() => null);
      index = 0;
      scored = false;
      if (audioUrl) URL.revokeObjectURL(audioUrl);
      audioUrl = URL.createObjectURL(selected);
      player.src = audioUrl;
      showScreen("practice");
      loadChunk();
    }

    function loadChunk() {
      scored = false;
      answerEl.value = "";
      answerEl.readOnly = false;
      reviewEl.hidden = true;
      expectedWordsEl.replaceChildren();
      typedWordsEl.replaceChildren();
      checkEl.disabled = false;
      revealEl.disabled = false;
      skipEl.disabled = false;
      jumpEl.max = String(session.length);
      jumpEl.value = String(index + 1);
      jumpTotalEl.textContent = "of " + session.length;
      stampEl.textContent = formatStamp(session[index].start) + "–" + formatStamp(session[index].end);
      statusEl.textContent = "Listen, then type. Play the sentence as needed.";
      syncSeekBar();
      playCurrent();
      answerEl.focus();
    }

    function onPlayButton() {
      if (!player.paused) player.pause();
      else playCurrent();
    }

    function syncPlayButton() {
      const playing = !player.paused && !player.ended;
      playEl.textContent = playing ? "Stop" : "Play";
      playEl.classList.toggle("stop", playing);
      playEl.classList.toggle("primary", !playing);
    }

    function playCurrent() {
      const bounds = sentenceBounds();
      if (!session[index]) return;
      stopAt = bounds.end;
      player.playbackRate = speed;
      const startPlay = () => {
        player.play().catch(() => {});
      };
      if (Math.abs((player.currentTime || 0) - bounds.start) < 0.04) {
        startPlay();
        return;
      }
      const onSeeked = () => {
        player.removeEventListener("seeked", onSeeked);
        startPlay();
      };
      player.addEventListener("seeked", onSeeked);
      player.currentTime = bounds.start;
      syncSeekBar();
    }

    function setSpeed(value) {
      speed = value;
      player.playbackRate = speed;
      speedButtons.forEach((button) => {
        button.classList.toggle("on", Number(button.dataset.speed) === speed);
      });
    }

    function nudgeSpeed(direction) {
      const current = SPEEDS.indexOf(speed);
      const next = Math.min(SPEEDS.length - 1, Math.max(0, current + direction));
      setSpeed(SPEEDS[next]);
    }

    function togglePlay() {
      if (practiceEl.hidden) return;
      if (!player.paused) {
        player.pause();
        return;
      }
      const bounds = sentenceBounds();
      if ((player.currentTime || 0) >= bounds.end - 0.05) {
        playCurrent();
        return;
      }
      stopAt = bounds.end;
      player.playbackRate = speed;
      player.play().catch(() => {});
    }

    function skipSeconds(delta) {
      if (practiceEl.hidden) return;
      const bounds = sentenceBounds();
      stopAt = bounds.end;
      const next = clampToSentence((player.currentTime || bounds.start) + delta);
      player.playbackRate = speed;
      const play = () => { player.play().catch(() => {}); };
      if (Math.abs((player.currentTime || 0) - next) < 0.02) {
        play();
      } else {
        player.addEventListener("seeked", play, { once: true });
        player.currentTime = next;
      }
      syncSeekBar();
    }

    function sentenceBounds() {
      const chunk = session[index];
      if (!chunk) return { start: 0, end: 0 };
      const start = Math.max(0, Number(chunk.start) || 0);
      let end = Math.max(start + 0.05, Number(chunk.end) || start);
      const following = session[index + 1];
      if (following && Number(following.start) <= end) {
        end = Math.max(start + 0.05, Number(following.start) - 0.02);
      }
      return { start: start, end: end };
    }

    function clampToSentence(time) {
      const bounds = sentenceBounds();
      return Math.min(bounds.end, Math.max(bounds.start, Number(time) || bounds.start));
    }

    function onTimeUpdate() {
      const bounds = sentenceBounds();
      if (player.currentTime >= bounds.end - 0.01) {
        player.pause();
        if (player.currentTime > bounds.end) player.currentTime = bounds.end;
      }
      if (!draggingSeek) syncSeekBar();
    }

    function syncSeekBar() {
      const bounds = sentenceBounds();
      const pos = draggingSeek ? clampToSentence(Number(seekEl.value)) : clampToSentence(player.currentTime || bounds.start);
      seekEl.min = String(bounds.start);
      seekEl.max = String(bounds.end);
      if (!draggingSeek) seekEl.value = String(pos);
      seekNowEl.textContent = formatStamp(pos);
      seekEndEl.textContent = formatStamp(bounds.end);
    }

    function jumpToSentence() {
      if (practiceEl.hidden || !session.length) return;
      const requested = Number(jumpEl.value);
      if (!Number.isFinite(requested)) {
        jumpEl.value = String(index + 1);
        return;
      }
      const target = Math.min(session.length, Math.max(1, Math.round(requested))) - 1;
      jumpEl.value = String(target + 1);
      if (target === index) {
        playCurrent();
        answerEl.focus();
        return;
      }
      index = target;
      loadChunk();
    }

    function onShortcut(event) {
      if (event.altKey && (event.key === "ArrowLeft" || event.key === "ArrowRight")) {
        event.preventDefault();
        return;
      }
      if (practiceEl.hidden) return;
      if (event.key === "[" || event.code === "BracketLeft") {
        event.preventDefault();
        skipSeconds(-SKIP_SECONDS);
        return;
      }
      if (event.key === "]" || event.code === "BracketRight") {
        event.preventDefault();
        skipSeconds(SKIP_SECONDS);
        return;
      }
      if (!(event.ctrlKey || event.metaKey)) return;
      if (event.key === "Enter") {
        event.preventDefault();
        if (!scored) checkAnswer();
        else nextChunk();
        return;
      }
      if (event.code === "Space") {
        event.preventDefault();
        togglePlay();
        return;
      }
      if (event.key === "ArrowUp") {
        event.preventDefault();
        nudgeSpeed(1);
        return;
      }
      if (event.key === "ArrowDown") {
        event.preventDefault();
        nudgeSpeed(-1);
      }
    }

    function checkAnswer() {
      if (scored) return;
      const expected = session[index].text;
      const typed = answerEl.value;
      const diff = diffWords(expected, typed);
      const grade = gradeDiff(diff);
      finishChunk(grade, typed, diff, false);
    }

    function revealAnswer() {
      if (scored) return;
      const expected = session[index].text;
      const typed = answerEl.value.trim();
      const diff = diffWords(expected, typed);
      finishChunk("missed", typed, diff, true);
    }

    function skipChunk() {
      if (scored) return;
      player.pause();
      results[index] = { grade: "skipped", typed: "" };
      if (index + 1 >= session.length) showSummary();
      else {
        index += 1;
        loadChunk();
      }
    }

    function finishChunk(grade, typed, diff, revealed) {
      scored = true;
      player.pause();
      results[index] = { grade: grade, typed: typed };
      answerEl.readOnly = true;
      checkEl.disabled = true;
      revealEl.disabled = true;
      skipEl.disabled = true;
      reviewEl.hidden = false;
      gradeEl.className = "grade " + grade;
      gradeEl.textContent = revealed ? "Revealed" : gradeLabel(grade);
      renderWords(expectedWordsEl, diff.expected);
      renderWords(typedWordsEl, diff.actual);
      nextEl.textContent = index + 1 >= session.length ? "Finish" : "Next";
    }

    function nextChunk() {
      if (index + 1 >= session.length) {
        showSummary();
        return;
      }
      index += 1;
      loadChunk();
    }

    function showSummary() {
      player.pause();
      const counts = { exact: 0, almost: 0, missed: 0, skipped: 0 };
      results.forEach((item) => {
        if (item && counts[item.grade] !== undefined) counts[item.grade] += 1;
      });
      summaryScoreEl.textContent = session.length + (session.length === 1 ? " sentence" : " sentences");
      summaryDetailEl.textContent =
        counts.exact + " exact · " +
        counts.almost + " almost · " +
        counts.missed + " missed · " +
        counts.skipped + " skipped";
      const retryCount = retryChunks().length;
      retryEl.disabled = retryCount === 0;
      retryEl.textContent = retryCount ? "Retry missed (" + retryCount + ")" : "Retry missed";
      statusEl.textContent = deviceLabel();
      showScreen("summary");
    }

    function retryChunks() {
      return session.filter((_, itemIndex) => {
        const grade = results[itemIndex] && results[itemIndex].grade;
        return grade === "missed" || grade === "almost";
      });
    }

    function retryMissed() {
      const missed = retryChunks();
      if (!missed.length) return;
      startSession(missed);
    }

    function resetAll() {
      player.pause();
      if (audioUrl) URL.revokeObjectURL(audioUrl);
      audioUrl = "";
      selected = null;
      chunks = [];
      session = [];
      results = [];
      index = 0;
      scored = false;
      preparedMeta = "";
      fileEl.value = "";
      fileMetaEl.hidden = true;
      fileMetaEl.textContent = "";
      startBtn.hidden = true;
      hideError();
      prepareBtn.disabled = true;
      statusEl.textContent = deviceLabel();
      showScreen("prepare");
    }

    function showScreen(name) {
      prepareEl.hidden = name !== "prepare";
      practiceEl.hidden = name !== "practice";
      summaryEl.hidden = name !== "summary";
    }

    function tokenize(text) {
      const matches = String(text || "").match(/[A-Za-z0-9]+(?:['’][A-Za-z0-9]+)*/g) || [];
      return matches.map((raw) => ({ raw: raw, key: raw.toLowerCase().replace(/’/g, "'") }));
    }

    function diffWords(expectedText, actualText) {
      const expected = tokenize(expectedText);
      const actual = tokenize(actualText);
      const n = expected.length;
      const m = actual.length;
      const dp = Array.from({ length: n + 1 }, () => Array(m + 1).fill(0));
      for (let i = 1; i <= n; i += 1) {
        for (let j = 1; j <= m; j += 1) {
          dp[i][j] = expected[i - 1].key === actual[j - 1].key
            ? dp[i - 1][j - 1] + 1
            : Math.max(dp[i - 1][j], dp[i][j - 1]);
        }
      }
      const expectedMarks = [];
      const actualMarks = [];
      let i = n;
      let j = m;
      while (i > 0 && j > 0) {
        if (expected[i - 1].key === actual[j - 1].key) {
          expectedMarks.push({ text: expected[i - 1].raw, type: "ok" });
          actualMarks.push({ text: actual[j - 1].raw, type: "ok" });
          i -= 1;
          j -= 1;
        } else if (dp[i - 1][j] >= dp[i][j - 1]) {
          expectedMarks.push({ text: expected[i - 1].raw, type: "missed" });
          i -= 1;
        } else {
          actualMarks.push({ text: actual[j - 1].raw, type: "extra" });
          j -= 1;
        }
      }
      while (i > 0) {
        i -= 1;
        expectedMarks.push({ text: expected[i].raw, type: "missed" });
      }
      while (j > 0) {
        j -= 1;
        actualMarks.push({ text: actual[j].raw, type: "extra" });
      }
      expectedMarks.reverse();
      actualMarks.reverse();
      return {
        expected: expectedMarks,
        actual: actualMarks,
        missed: expectedMarks.filter((item) => item.type === "missed").length,
        extra: actualMarks.filter((item) => item.type === "extra").length,
        expectedCount: n,
      };
    }

    function gradeDiff(diff) {
      if (diff.expectedCount === 0) return "missed";
      if (diff.missed === 0 && diff.extra === 0) return "exact";
      const errors = diff.missed + diff.extra;
      if (errors <= 1 || errors / diff.expectedCount <= 0.2) return "almost";
      return "missed";
    }

    function gradeLabel(grade) {
      if (grade === "exact") return "Exact";
      if (grade === "almost") return "Almost";
      return "Missed";
    }

    function renderWords(root, marks) {
      root.replaceChildren();
      if (!marks.length) {
        const empty = document.createElement("span");
        empty.textContent = "—";
        root.appendChild(empty);
        return;
      }
      marks.forEach((mark) => {
        const span = document.createElement("span");
        span.textContent = mark.text;
        if (mark.type !== "ok") span.className = mark.type;
        root.appendChild(span);
      });
    }

    function showError(message) {
      errorEl.hidden = false;
      errorEl.textContent = message;
    }

    function hideError() {
      errorEl.hidden = true;
      errorEl.textContent = "";
    }

    function deviceLabel() {
      if (!health) return "Checking the transcription model…";
      if (health.error) return health.error;
      if (!health.ready) {
        return "Loading the transcription model. The first run downloads about 1.6 GB and can take several minutes.";
      }
      if (health.device === "cuda") return "Ready on GPU (float16).";
      return "Ready on CPU (int8). GPU libraries were not available.";
    }

    function formatSize(bytes) {
      if (bytes < 1024) return bytes + " B";
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " KB";
      return (bytes / (1024 * 1024)).toFixed(1) + " MB";
    }

    function formatDuration(seconds) {
      const total = Math.round(Number(seconds) || 0);
      const minutes = Math.floor(total / 60);
      const remain = total % 60;
      if (minutes === 0) return remain + " sec";
      return minutes + " min " + remain + " sec";
    }

    function formatStamp(seconds) {
      const total = Math.max(0, Number(seconds) || 0);
      const minutes = Math.floor(total / 60);
      const remain = (total - minutes * 60).toFixed(1);
      return minutes + ":" + remain.padStart(4, "0");
    }

    async function readError(response) {
      try {
        const body = await response.json();
        if (typeof body.detail === "string") return body.detail;
      } catch {
        /* ignore malformed bodies */
      }
      return "Preparation failed. Try another file.";
    }

    async function refreshHealth() {
      try {
        const response = await fetch("/api/health");
        health = await response.json();
        if (practiceEl.hidden && summaryEl.hidden && !busy) statusEl.textContent = deviceLabel();
        prepareBtn.disabled = !canPrepare();
        if (!health.ready && !health.error) setTimeout(refreshHealth, 2000);
      } catch {
        health = null;
        if (practiceEl.hidden && !busy) statusEl.textContent = "The server is not responding.";
        setTimeout(refreshHealth, 2000);
      }
    }

    refreshHealth();
  </script>
</body>
</html>
